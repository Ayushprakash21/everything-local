<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,700;0,900;1,900&amp;family=Manrope:wght@800;900&amp;display=swap');
      .brand-full-title {
        font-family: 'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 44px;
        letter-spacing: -0.9px;
      }
      .brand-full-tagline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 19px;
        letter-spacing: -0.2px;
      }
    </style>
  </defs>

  <!-- Scaled Symbol on Left -->
  <g transform="translate(6, 4) scale(0.78)">
    <path d="M 72 32 C 72 12, 108 12, 108 32" fill="none" stroke="#F5B82E" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 54 34 L 124 34 C 134 34, 140 42, 144 58 L 149 86 C 152 98, 146 108, 132 112" 
          fill="none" stroke="#F5B82E" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 46 54 L 39 86 C 35 98, 42 108, 56 112" 
          fill="none" stroke="#F5B82E" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="99" font-family="'Inter', 'Manrope', sans-serif" font-weight="900" font-style="italic" font-size="62" fill="#0B1F3B" letter-spacing="-3">EB</text>
    <path d="M 28 96 C 18 114, 30 134, 60 140 C 84 144, 110 138, 122 129 C 97 137, 69 137, 45 129 C 29 121, 22 108, 28 96 Z" fill="#10B981"/>
    <g transform="translate(26, 95)">
      <path d="M 0 -11 C -6 -11, -11 -6, -11 0 C -11 7, 0 17, 0 17 C 0 17, 11 7, 11 0 C 11 -6, 6 -11, 0 -11 Z" fill="#F5B82E"/>
      <circle cx="0" cy="0" r="3.8" fill="#FFFFFF"/>
    </g>
    <path d="M 64 125 C 95 135, 131 131, 155 113 C 171 99, 178 79, 175 61 C 177 77, 168 95, 149 107 C 127 121, 93 125, 64 125 Z" fill="#F5B82E"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="158" y1="20" x2="158" y2="108" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wordmark: EveryBazaar -->
  <text x="178" y="64" class="brand-full-title" fill="#0B1F3B">
    Every<tspan fill="#F5B82E">Bazaar</tspan>
  </text>

  <!-- Green Leaf Accent above 'y' -->
  <path d="M 295 24 C 305 23, 310 30, 307 36 C 297 37, 291 29, 295 24 Z" fill="#10B981"/>

  <!-- Tagline: Shop more. Save more. Live better. -->
  <text x="180" y="98" class="brand-full-tagline" fill="#6B7280">Shop more. Save more. Live better.</text>

  <!-- Dynamic Amber Smile Curve under 'Live better.' -->
  <path d="M 408 108 Q 455 120 505 106" fill="none" stroke="#F5B82E" stroke-width="3" stroke-linecap="round"/>
</svg>
