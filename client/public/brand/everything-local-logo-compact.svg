<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,900;1,900&amp;family=Manrope:wght@800;900&amp;display=swap');
      .brand-compact-title {
        font-family: 'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 46px;
        letter-spacing: -0.9px;
      }
    </style>
  </defs>

  <!-- Scaled Symbol on Left -->
  <g transform="translate(4, -4) scale(0.74)">
    <!-- Shopping Bag Handle -->
    <path d="M 72 32 C 72 12, 108 12, 108 32" fill="none" stroke="#F5B82E" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Shopping Bag Frame -->
    <path d="M 54 34 L 124 34 C 134 34, 140 42, 144 58 L 149 86 C 152 98, 146 108, 132 112" 
          fill="none" stroke="#F5B82E" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 46 54 L 39 86 C 35 98, 42 108, 56 112" 
          fill="none" stroke="#F5B82E" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- EB Monogram -->
    <text x="46" y="99" font-family="'Inter', 'Manrope', sans-serif" font-weight="900" font-style="italic" font-size="62" fill="#0B1F3B" letter-spacing="-3">EB</text>

    <!-- Dynamic Green Swoosh -->
    <path d="M 28 96 C 18 114, 30 134, 60 140 C 84 144, 110 138, 122 129 C 97 137, 69 137, 45 129 C 29 121, 22 108, 28 96 Z" 
          fill="#10B981"/>

    <!-- Location Pin -->
    <g transform="translate(26, 95)">
      <path d="M 0 -11 C -6 -11, -11 -6, -11 0 C -11 7, 0 17, 0 17 C 0 17, 11 7, 11 0 C 11 -6, 6 -11, 0 -11 Z" fill="#F5B82E"/>
      <circle cx="0" cy="0" r="3.8" fill="#FFFFFF"/>
    </g>

    <!-- Dynamic Amber Swoosh -->
    <path d="M 64 125 C 95 135, 131 131, 155 113 C 171 99, 178 79, 175 61 C 177 77, 168 95, 149 107 C 127 121, 93 125, 64 125 Z" 
          fill="#F5B82E"/>
  </g>

  <!-- Wordmark -->
  <text x="156" y="72" class="brand-compact-title" fill="#0B1F3B">
    Every<tspan fill="#F5B82E">Bazaar</tspan>
  </text>

  <!-- Green Leaf Accent -->
  <path d="M 276 30 C 286 29, 291 36, 288 42 C 278 43, 272 35, 276 30 Z" fill="#10B981"/>
</svg>
