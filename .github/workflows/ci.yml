name: EveryBazaar CI & Release Protection

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  validate-and-test:
    name: Build, Validate Isolation & Regression Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Cloudflare Environment Isolation
        run: npm run validate:environments

      - name: Validate Secret Hygiene & Fail-Closed Auth
        run: npm run validate:secrets

      - name: Server TypeScript Build Check
        run: npm run build:server

      - name: Client Vite Production Build
        run: npm run build:client

      - name: Execute Full Platform Vitest Suite
        run: npm test

      - name: Install Mobile Dependencies
        run: npm ci --prefix mobile

      - name: Mobile TypeScript Strict Check
        run: npm run typecheck --prefix mobile

      - name: Mobile Vitest Suite
        run: npm run test --prefix mobile
