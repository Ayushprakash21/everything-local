# EveryBazaar / Everything Local — API Worker Configuration
# Dedicated Account: 6ab31e6d677b2f74c2b27f217c2f4c9c
account_id = "6ab31e6d677b2f74c2b27f217c2f4c9c"

# ==============================================================================
# PRODUCTION ENVIRONMENT (Isolated & Untouched)
# Worker: everything-local-api
# Live URL: https://everything-local-api.everything-local.workers.dev
# ==============================================================================
name = "everything-local-api"
main = "server/src/worker.ts"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]

# D1 Relational Database Binding
[[d1_databases]]
binding = "DB"
database_name = "everything-local-db"
database_id = "39a50b18-37a7-42f5-92eb-0983caeaf914"
migrations_dir = "d1-migrations"

# R2 Object Storage Binding (Private KYC Documents & Public Catalog)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "everything-local-media"

# KV Cache & Session Namespace Binding
[[kv_namespaces]]
binding = "CACHE_KV"
id = "cca418a4d3fd487db664bf67677e5d08"

# Production Environment Variables
[vars]
ENVIRONMENT = "production"
CITY = "Indore"
COMMISSION_RATE_PCT = "3.5"
JWT_EXPIRY = "7d"
CORS_ORIGIN = "https://everything-local-web.everything-local.workers.dev"

# ==============================================================================
# DEVELOPMENT ENVIRONMENT (EveryBazaar Development Worker)
# Worker: everybazaar-api-dev
# Live URL: https://everybazaar-api-dev.everything-local.workers.dev
# ==============================================================================
[env.development]
name = "everybazaar-api-dev"
main = "server/src/worker.ts"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
account_id = "6ab31e6d677b2f74c2b27f217c2f4c9c"

[[env.development.d1_databases]]
binding = "DB"
database_name = "everything-local-db"
database_id = "39a50b18-37a7-42f5-92eb-0983caeaf914"
migrations_dir = "d1-migrations"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "everything-local-media"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "cca418a4d3fd487db664bf67677e5d08"

[env.development.vars]
ENVIRONMENT = "development"
CITY = "Indore"
COMMISSION_RATE_PCT = "3.5"
JWT_EXPIRY = "7d"
CORS_ORIGIN = "*"

# ==============================================================================
# STAGING ENVIRONMENT (EveryBazaar Staging Worker)
# Worker: everybazaar-api-staging
# Expected URL: https://everybazaar-api-staging.everything-local.workers.dev
# Provisioning: npx wrangler d1 create everybazaar-staging-db
#               npx wrangler r2 bucket create everybazaar-staging-media
#               npx wrangler kv:namespace create everybazaar-staging-kv
# ==============================================================================
[env.staging]
name = "everybazaar-api-staging"
main = "server/src/worker.ts"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
account_id = "6ab31e6d677b2f74c2b27f217c2f4c9c"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "everybazaar-staging-db"
database_id = "everybazaar-staging-db-unprovisioned"
migrations_dir = "d1-migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "everybazaar-staging-media"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "everybazaar-staging-kv-unprovisioned"

[env.staging.vars]
ENVIRONMENT = "staging"
CITY = "Indore"
COMMISSION_RATE_PCT = "3.5"
JWT_EXPIRY = "7d"
CORS_ORIGIN = "https://everybazaar-staging-web.everything-local.workers.dev"
